<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donghua Details | chinesXdonghua</title>

    <meta name="theme-color" content="#08090d">

    <link rel="stylesheet" href="asset/css/style.css">
    <link rel="stylesheet" href="asset/css/pages.css">

    <style>
        .details-loading {
            text-align: center;
            padding: 100px 20px;
            color: var(--muted);
        }

        .details-banner {
            min-height: 420px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .details-banner::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                #08090d 5%,
                rgba(8,9,13,.85) 50%,
                rgba(8,9,13,.3)
            );
        }

        .details-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 30px;
            padding: 45px 0;
        }

        .details-poster {
            width: 210px;
            flex-shrink: 0;
            border-radius: 14px;
            box-shadow: 0 15px 40px #000;
        }

        .details-info {
            max-width: 700px;
        }

        .details-info h1 {
            font-size: 36px;
            margin: 15px 0;
        }

        .details-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            color: #ddd;
            font-size: 13px;
        }

        .details-description {
            color: #c4c5ce;
            line-height: 1.8;
            margin: 20px 0;
        }

        .details-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .genre-tag {
            padding: 7px 12px;
            background: #20222b;
            border-radius: 20px;
            font-size: 12px;
        }

        .details-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        .info-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            margin-top: 25px;
        }

        .info-panel h2 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .info-item {
            color: var(--muted);
            font-size: 13px;
        }

        .info-item strong {
            display: block;
            color: white;
            margin-top: 7px;
        }

        .error-message {
            text-align: center;
            padding: 80px 20px;
        }

        @media(max-width:700px) {
            .details-banner {
                min-height: auto;
            }

            .details-content {
                flex-direction: column;
                align-items: flex-start;
                padding: 30px 0;
            }

            .details-poster {
                width: 145px;
            }

            .details-info h1 {
                font-size: 25px;
            }

            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar" id="navbar">

        <div class="container navbar-inner">

            <a href="index.html" class="logo">
                chinesX<span style="color:white;">donghua</span>
            </a>

            <nav class="nav-links">
                <a href="index.html" data-nav>Home</a>
                <a href="index.html#trending-list">Trending</a>
                <a href="schedule.html" data-nav>Schedule</a>
                <a href="my-list.html" data-nav>My List</a>
            </nav>

            <div class="nav-actions">

                <button class="icon-button"
                    onclick="location.href='search.html'">
                    🔍
                </button>

                <button class="icon-button"
                    id="menu-toggle">
                    ☰
                </button>

            </div>

        </div>

        <div class="mobile-menu" id="mobile-menu">
            <a href="index.html">Home</a>
            <a href="search.html">Search</a>
            <a href="schedule.html">Schedule</a>
            <a href="my-list.html">My List</a>
        </div>

    </header>


    <!-- DETAILS -->

    <main id="anime-details">

        <div class="details-loading">
            <div class="spinner"></div>
            Loading Donghua Details...
        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <h2 style="color:var(--orange);">
            chinesXdonghua
        </h2>

        <p style="margin-top:10px;">
            Discover the world of Chinese Animation.
        </p>

        <p style="margin-top:20px;font-size:12px;">
            © 2026 chinesXdonghua
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="asset/js/app.js"></script>
    <script src="asset/js/nav.js"></script>
    <script src="asset/js/anime.js"></script>

</body>
</html>
